name: CI
on:
	push:
		branches: [main]
	pull_request:
		branches: [main]

jobs:
	test:
		runs-on: ubuntu-latest
		steps:
			- uses: actions/checkout@v4
			- uses: actions/setup-node@v4
				with: { node-version: 22, cache: "npm" }
			- run: npm ci
			- run: npm run typecheck
			- run: npm test
			- run: npm run lint

	eval:
		runs-on: ubuntu-latest
		needs: test
		if: github.event_name == 'push' && github.ref == 'refs/heads/main'
		# Skipped automatically if ANTHROPIC_API_KEY is not set
		# To enable: add ANTHROPIC_API_KEY as a repository secret in Settings > Secrets
		continue-on-error: true
		steps:
			- uses: actions/checkout@v4
			- uses: actions/setup-node@v4
				with: { node-version: 22, cache: "npm" }
			- run: npm ci
			- name: Run eval harness (requires ANTHROPIC_API_KEY)
				env:
					ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
				run: |
					if [ -z "$ANTHROPIC_API_KEY" ]; then
						echo "Skipping eval: ANTHROPIC_API_KEY not set"
						exit 0
					fi
					npm run eval
